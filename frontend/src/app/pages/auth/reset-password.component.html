<section class="auth-page"><div class="auth-card"><div class="auth-brand"><span>AC</span><div><b>ADARSH</b><small>CARGO</small></div></div><p class="eyebrow">SECURE RESET</p><h1>Set a new password.</h1><p class="muted">Choose a new password with at least 6 characters.</p><form (ngSubmit)="submit()"><label>New password<input name="password" type="password" [(ngModel)]="password" required minlength="6" placeholder="Minimum 6 characters"></label><label>Confirm password<input name="confirm" type="password" [(ngModel)]="confirm" required minlength="6" placeholder="Repeat new password"></label><p class="success" *ngIf="message">{{message}}</p><p class="error" *ngIf="error">{{error}}</p><button class="primary" [disabled]="busy">{{busy?'Saving…':'Reset password'}}</button></form><p class="switch">Remembered your password? <a routerLink="/login">Sign in</a></p></div></section>
