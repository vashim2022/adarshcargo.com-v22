<section class="auth-page"><div class="auth-card"><div class="auth-brand"><span>AC</span><div><b>ADARSH</b><small>CARGO</small></div></div><p class="eyebrow">CUSTOMER, ADMIN & DELIVERY PARTNER ACCESS</p><h1>Welcome back.</h1><p class="muted">Sign in to manage bookings, access operations or complete assigned delivery work.</p><form (ngSubmit)="submit()"><label>Email<input name="email" type="email" [(ngModel)]="form.email" required placeholder="you@company.com"></label><label>Password<input name="password" type="password" [(ngModel)]="form.password" required placeholder="••••••••"></label><div class="password-row"><span></span><a routerLink="/forgot-password">Forgot password?</a></div><p class="error" *ngIf="error">{{error}}</p><button class="primary" [disabled]="busy">{{busy?'Signing in…':'Sign in'}}</button></form><p class="switch">New to Adarsh Cargo? <a routerLink="/register">Create an account</a></p><a routerLink="/" class="back">← Back to website</a></div></section>
