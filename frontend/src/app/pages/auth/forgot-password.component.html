<section class="auth-page"><div class="auth-card"><div class="auth-brand"><span>AC</span><div><b>ADARSH</b><small>CARGO</small></div></div><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Forgot password?</h1><p class="muted">Enter your account email and we will send you a secure password reset link.</p><form (ngSubmit)="submit()"><label>Email<input name="email" type="email" [(ngModel)]="email" required placeholder="you@company.com"></label><p class="success" *ngIf="message">{{message}}</p><p class="error" *ngIf="error">{{error}}</p><a class="dev-link" *ngIf="devResetUrl" [href]="devResetUrl">Open local reset link</a><button class="primary" [disabled]="busy">{{busy?'Sending…':'Send reset link'}}</button></form><p class="switch">Remembered your password? <a routerLink="/login">Sign in</a></p><a routerLink="/" class="back">← Back to website</a></div></section>
