<section class="auth-page"><div class="auth-card"><div class="auth-brand"><span>AC</span><div><b>ADARSH</b><small>CARGO</small></div></div><p class="eyebrow">CUSTOMER ACCOUNT</p><h1>Create your account.</h1><p class="muted">Save your shipment details and request cargo quotes faster.</p><form (ngSubmit)="submit()"><label>Full name<input name="name" [(ngModel)]="form.name" required placeholder="Your name"></label><div class="two"><label>Email<input name="email" type="email" [(ngModel)]="form.email" required placeholder="you@company.com"></label><label>Phone<input name="phone" [(ngModel)]="form.phone" placeholder="+91 98xxxxxx"></label></div><label>Password<input name="password" type="password" [(ngModel)]="form.password" required minlength="6" placeholder="Minimum 6 characters"></label><p class="error" *ngIf="error">{{error}}</p><button class="primary" [disabled]="busy">{{busy?'Creating…':'Create account'}}</button></form><p class="switch">Already have an account? <a routerLink="/login">Sign in</a></p><a routerLink="/" class="back">← Back to website</a></div></section>
