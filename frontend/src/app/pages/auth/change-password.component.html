<section class="auth-page"><div class="auth-card"><div class="auth-brand"><span>AC</span><div><b>ADARSH</b><small>CARGO</small></div></div><p class="eyebrow">ACCOUNT SECURITY</p><h1>Change password.</h1><p class="muted">Update the password for your {{auth.user()?.role==='admin'?'admin':'customer'}} account.</p><form (ngSubmit)="submit()"><label>Current password<input name="currentPassword" type="password" [(ngModel)]="currentPassword" required placeholder="Current password"></label><label>New password<input name="newPassword" type="password" [(ngModel)]="newPassword" required minlength="6" placeholder="Minimum 6 characters"></label><label>Confirm new password<input name="confirm" type="password" [(ngModel)]="confirm" required minlength="6" placeholder="Repeat new password"></label><p class="success" *ngIf="message">{{message}}</p><p class="error" *ngIf="error">{{error}}</p><button class="primary" [disabled]="busy">{{busy?'Updating…':'Change password'}}</button></form><p class="switch"><a routerLink="/">Back to website</a></p></div></section>
